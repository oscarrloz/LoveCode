<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LoveCode</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="box">
    <h1>LoveCode</h1>
    <p>Haz match con tu código ideal.</p>

    <div id="msg" style="display:none; padding:8px; border-radius:5px; margin-bottom:10px; font-size:13px;"></div>

    <label>Email</label>
    <input id="email" type="email" placeholder="tu@correo.com"/>

    <label>Contraseña</label>
    <input id="password" type="password" placeholder="••••••••"/>

    <button onclick="hacerLogin()">Entrar</button>

    <div class="footer">¿Sin cuenta? <a href="registro.html">Regístrate</a></div>
  </div>

  <script>
    const SERVIDOR = 'http://localhost:8080';

    async function hacerLogin() {
      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        mostrarMensaje('Rellena todos los campos', 'error');
        return;
      }

      try {
        const respuesta = await fetch(SERVIDOR + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        const datos = await respuesta.json();

        if (datos.ok) {
          sessionStorage.setItem('idSesion', datos.id);
          window.location.href = 'perfiles.html';
        } else {
          mostrarMensaje(datos.error, 'error');
        }

      } catch (e) {
        mostrarMensaje('No se puede conectar con el servidor', 'error');
      }
    }

    function mostrarMensaje(texto, tipo) {
      const msg = document.getElementById('msg');
      msg.textContent  = texto;
      msg.style.display = 'block';
      msg.style.background = tipo === 'error' ? '#5a0a0a' : '#0a3d1f';
      msg.style.color      = '#ffffff';
    }
  </script>
</body>
</html>
